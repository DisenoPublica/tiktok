<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe semanal de conversación · TikTok</title>
<meta name="description" content="Resumen semanal de la conversación en medios sobre TikTok en Argentina, Chile y Perú.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">
<link rel="icon" href="assets/note_white.svg" type="image/svg+xml">
<script src="config.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);background:#000}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:"TikTok Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(0,0,0,.86);backdrop-filter:blur(10px)}
:focus-visible{outline:2px solid #25F4EE;outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);border-bottom:1px solid #1E1E1E}
.bar-in{max-width:1160px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px}
.bar-logo{display:block;flex:none} .bar-logo svg{height:26px;width:auto;display:block}
.bar nav{margin-left:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.bar nav a{font-size:14px;font-weight:700;text-decoration:none;color:#fff;padding:7px 14px;border-radius:999px;white-space:nowrap;box-shadow:inset 0 0 0 1.5px #2A2A2A}
.bar nav a:hover{box-shadow:inset 0 0 0 1.5px #25F4EE}
main{max-width:1160px;margin:0 auto;padding:22px 24px 60px}
.status{background:#161616;border-radius:28px;padding:56px 28px;text-align:center;color:#B3B3B3}
#report .tt{border-radius:28px}
.archive{margin-top:64px}
.archive h2{font-weight:900;font-size:clamp(28px,3.6vw,40px);letter-spacing:-.01em;margin:0}
.archive > p{margin:12px 0 22px;color:#B3B3B3}
.legend{display:flex;gap:16px;font-size:13px;color:#B3B3B3;margin:0 0 18px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wk{display:block;background:#161616;border-radius:28px;padding:22px 22px 20px;text-decoration:none;color:#fff;box-shadow:inset 0 0 0 1.5px transparent}
.wk:hover{box-shadow:inset 0 0 0 1.5px #3A3A3A}
.wk[aria-current="true"]{box-shadow:inset 0 0 0 2px #25F4EE}
.wk .d{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:6px;background:#fff;color:#000}
.wk[aria-current="true"] .d{background:#25F4EE}
.wk .n{font-weight:900;font-size:30px;line-height:1;margin:14px 0 2px}
.wk .n small{font-size:13px;font-weight:500;color:#B3B3B3;margin-left:6px}
.wk .row{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:13px;margin-top:9px;color:#E6E6E6}
.stack{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#2A2A2A}
.stack i{display:block;height:100%}
footer.site{max-width:1160px;margin:0 auto;padding:0 24px 40px}
footer.site span{display:block;width:180px;height:8px;background:linear-gradient(#25F4EE 0 50%,#FE2C55 50% 100%)}

/* animaciones: barrido de barras y conteo */
.sweep{clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.2,.7,.2,1)}
.sweep.in{clip-path:inset(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.sweep{clip-path:none;transition:none}}
@media (max-width:760px){
  .bar-in{padding:10px 14px;gap:12px}.bar-logo svg{height:22px}
  .bar nav a{padding:6px 11px;font-size:13px}
  main{padding:12px 8px 40px}
  .archive{margin-top:44px;padding:0 6px}
}
/* ===== Informe TikTok: estilos compartidos (sitio + vista web del editor) ===== */
.tt{--k:#000;--c1:#161616;--c2:#1E1E1E;--c3:#2A2A2A;--w:#FFFFFF;--t2:#B3B3B3;--t3:#8A8A8A;--cy:#25F4EE;--rd:#FE2C55;--nt:#5E5E5E;
  background:var(--k);color:var(--w);font-family:"TikTok Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-optical-sizing:auto;line-height:1.55;position:relative;overflow:hidden}
.tt *,.tt *::before,.tt *::after{box-sizing:border-box}
.tt a{color:inherit}
.tt-hero{position:relative;padding:56px 56px 40px}
.tt-mark{position:absolute;right:-60px;top:20px;width:420px;opacity:1;pointer-events:none}
.tt-mark path{fill:var(--c2)!important}
.tt-tags{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.tt-tag{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:6px;color:#000;background:var(--w)}
.tt-tag.rd{background:var(--rd)} .tt-tag.cy{background:var(--cy)} .tt-tag.ol{background:transparent;color:var(--w);box-shadow:inset 0 0 0 1.5px #3A3A3A}
.tt-h1{position:relative;font-weight:900;font-size:clamp(40px,6.4vw,76px);line-height:1;letter-spacing:-.02em;margin:22px 0 0;max-width:11.5em;
}
.tt-sub{position:relative;display:flex;gap:10px;margin:20px 0 0}
.tt-sub svg{width:36px;height:24px;border-radius:4px;display:block}
.tt-sep{display:block;width:180px;height:8px;margin:26px 0 0;background:linear-gradient(var(--cy) 0 50%,var(--rd) 50% 100%);position:relative}
.tt-kpis{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:34px;max-width:760px}
.tt-kpi{background:var(--c1);border-radius:12px;padding:16px 18px 16px 20px;position:relative;overflow:hidden}
.tt-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cy)}
.tt-kpi.rd::before{background:var(--rd)}
.tt-kpi b{display:block;font-weight:900;font-size:38px;line-height:1;letter-spacing:-.01em}
.tt-kpi span{display:block;font-size:13px;color:var(--t2);margin-top:6px}
.tt-body{padding:8px 56px 40px}
.tt-c{background:var(--c1);border-radius:28px;padding:34px 34px 30px;margin:0 0 20px;scroll-margin-top:80px}
.tt-c-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.tt-c-head h2{margin:0;font-weight:900;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:12px}
.tt-c-head h2 svg{width:34px;height:23px;border-radius:4px;flex:none}
.tt-c-head .tt-tags{margin-left:auto}
.tt-c-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:34px}
.tt-txt{max-width:72ch;display:flex;flex-direction:column;gap:12px}
.tt-box{background:#FFFFFF;color:#000000;border-radius:20px;padding:22px 26px 24px}
.tt-txt h3{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:#000000}
.tt-txt h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tt-txt p{margin:0;font-size:16px;line-height:1.65;color:#1A1A1A}
.tt .tt-txt a{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;color:#000000;font-weight:700}
.tt-box.p a{text-decoration-color:var(--cy)} .tt-box.n a{text-decoration-color:var(--rd)}
.tt .tt-txt a:hover{background:#000000;color:#FFFFFF}
.tt-side{display:flex;flex-direction:column;gap:10px}
.tt-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--c3);margin-bottom:4px}
.tt-bar i{display:block;height:100%}
.tt-bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tt-bal div{background:var(--c2);border-radius:12px;padding:12px 12px 11px;position:relative;overflow:hidden}
.tt-bal div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.tt-bal .p::before{background:var(--cy)} .tt-bal .u::before{background:var(--nt)} .tt-bal .n::before{background:var(--rd)}
.tt-bal b{display:block;font-weight:900;font-size:24px;line-height:1}
.tt-bal span{display:block;font-size:11.5px;color:var(--t2);margin-top:5px;line-height:1.25}
.tt-bal em{font-style:normal;font-weight:700;color:var(--w)}
.tt-pro{font-size:13px;color:var(--t2)} .tt-pro b{color:var(--cy)}
.tt-side h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 0;color:var(--t3)}
.tt .tt-card{display:block;text-decoration:none;background:var(--w);color:#000;border-radius:12px;padding:14px 15px}
.tt-card:hover{box-shadow:4px 4px 0 var(--rd),-4px -4px 0 var(--cy)}
.tt-card small{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#000;color:#fff;border-radius:4px;padding:2px 7px;margin-bottom:8px}
.tt-card span{display:block;font-weight:700;font-size:15px;line-height:1.3}
.tt-foot{padding:26px 56px 34px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--t3);font-size:13px}
.tt-foot svg{height:22px;width:auto}
@media (max-width:820px){
  .tt-hero{padding:40px 20px 28px}.tt-mark{width:260px;right:-70px;top:60px}
  .tt-kpis{gap:8px}.tt-kpi{padding:12px 10px 12px 14px}.tt-kpi b{font-size:26px}.tt-kpi span{font-size:11.5px}
  .tt-body{padding:4px 10px 24px}.tt-c{padding:26px 18px 20px;border-radius:22px}
  .tt-c-grid{grid-template-columns:1fr;gap:6px}.tt-c-head .tt-tags{margin-left:0}
  .tt-foot{padding:22px 20px 30px}
}

</style>
</head>

4.9 L 833.5 424.9 L 784.5 334.9 Z M 829.7 286.4 \"/></svg>";
/* ===== Informe TikTok: render compartido. w = {rotulo, lunes, domingo, paises:[{pais,pos,neu,neg,proactivas,texto_positivo,texto_negativo,destacadas:[{titulo,medio,link}]}]} ===== */
const TT_FLAGS = {
  "Argentina": '<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#74ACDF"/><rect y="6.67" width="30" height="6.66" fill="#fff"/><circle cx="15" cy="10" r="2.3" fill="#F6B40E"/></svg>',
  "Chile": '<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><rect y="10" width="30" height="10" fill="#D52B1E"/><rect width="10" height="10" fill="#0039A6"/><path d="M5 2.6l.9 2.6h2.7l-2.2 1.6.8 2.6L5 7.8 2.8 9.4l.8-2.6-2.2-1.6h2.7z" fill="#fff"/></svg>',
  "Perú": '<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#D91023"/><rect x="10" width="10" height="20" fill="#fff"/></svg>'
};
const TT_ANCHOR = {"Argentina":"argentina","Chile":"chile","Perú":"peru"};
const ttEsc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ttUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const ttMd = t => ttEsc(t).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, a, u) => `<a href="${ttEsc(ttUrl(u.replace(/&amp;/g,"&")))}" target="_blank" rel="noopener">${a}</a>`);
const ttPct = (n, t) => t ? Math.round(100 * n / t) : 0;
const ttSing = (n, a, b) => n === 1 ? a : b;
const TT_MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function ttRango(l, d){
  const a = new Date(l + "T12:00:00"), b = new Date(d + "T12:00:00");
  return a.getMonth() === b.getMonth() ? `${a.getDate()} al ${b.getDate()} de ${TT_MESES[b.getMonth()]} ${b.getFullYear()}`
    : `${a.getDate()} de ${TT_MESES[a.getMonth()]} al ${b.getDate()} de ${TT_MESES[b.getMonth()]} ${b.getFullYear()}`;
}
function ttReport(w, opts = {}){
  const ps = w.paises.map(c => ({...c, total: c.pos + c.neu + c.neg}));
  const tot = ps.reduce((s, c) => s + c.total, 0), neg = ps.reduce((s, c) => s + c.neg, 0), pro = ps.reduce((s, c) => s + c.proactivas, 0);
  let h = `<div class="tt">
  <header class="tt-hero">
    <div class="tt-mark" aria-hidden="true">${TT_NOTE}</div>
    <div class="tt-tags">${opts.latest ? '<span class="tt-tag rd">Última semana</span>' : ""}<span class="tt-tag cy">${ttEsc(w.rotulo)}</span></div>
    <h1 class="tt-h1">Informe semanal de conversación</h1>
    <p class="tt-sub" role="img" aria-label="Argentina, Chile y Perú">${TT_FLAGS["Argentina"]}${TT_FLAGS["Chile"]}${TT_FLAGS["Perú"]}</p>
    <span class="tt-sep" aria-hidden="true"></span>
    <div class="tt-kpis">
      <div class="tt-kpi"><b>${tot}</b><span>notas en la semana</span></div>
      <div class="tt-kpi rd"><b>${ttPct(neg, tot)}%</b><span>de notas negativas</span></div>
      <div class="tt-kpi"><b>${pro}</b><span>${ttSing(pro, "nota proactiva", "notas proactivas")}</span></div>
    </div>
  </header>
  <div class="tt-body">`;
  ps.forEach(c => {
    const t = c.total;
    h += `<section class="tt-c" id="${TT_ANCHOR[c.pais] || ""}" aria-label="${ttEsc(c.pais)}">
      <div class="tt-c-head"><h2>${TT_FLAGS[c.pais] || ""}${ttEsc(c.pais)}</h2>
        <div class="tt-tags"><span class="tt-tag ol">${t} notas</span>${c.proactivas ? `<span class="tt-tag cy">${c.proactivas} ${ttSing(c.proactivas, "proactiva", "proactivas")}</span>` : ""}</div></div>
      <div class="tt-c-grid">
        <div class="tt-txt">
          <div class="tt-box p"><h3><i style="background:var(--cy)"></i>Positivas</h3><p>${ttMd(c.texto_positivo)}</p></div>
          <div class="tt-box n"><h3><i style="background:var(--rd)"></i>Negativas</h3><p>${ttMd(c.texto_negativo)}</p></div>
        </div>
        <aside class="tt-side" aria-label="Balance de tono de ${ttEsc(c.pais)}">
          <div class="tt-bar" role="img" aria-label="${c.pos} positivas, ${c.neu} neutras, ${c.neg} negativas"><i style="width:${ttPct(c.pos,t)}%;background:var(--cy)"></i><i style="width:${ttPct(c.neu,t)}%;background:var(--nt)"></i><i style="width:${ttPct(c.neg,t)}%;background:var(--rd)"></i></div>
          <div class="tt-bal">
            <div class="p"><b>${c.pos}</b><span><em>${ttPct(c.pos,t)}%</em> ${ttSing(c.pos,"positiva","positivas")}</span></div>
            <div class="u"><b>${c.neu}</b><span><em>${ttPct(c.neu,t)}%</em> ${ttSing(c.neu,"neutra","neutras")}</span></div>
            <div class="n"><b>${c.neg}</b><span><em>${ttPct(c.neg,t)}%</em> ${ttSing(c.neg,"negativa","negativas")}</span></div>
          </div>
          ${(c.destacadas || []).length ? `<h4>Notas destacadas</h4>` + c.destacadas.map(d => `<a class="tt-card" href="${ttEsc(ttUrl(d.link))}" target="_blank" rel="noopener"><small>${ttEsc(d.medio)}</small><span>${ttEsc(d.titulo)}</span></a>`).join("") : ""}
        </aside>
      </div>
    </section>`;
  });
  h += `</div>
  <footer class="tt-foot">${TT_LOGO}<span>Conteo sobre el total de notas publicadas de lunes a domingo en medios de Argentina, Chile y Perú.</span></footer>
</div>`;
  return h;
}

(() => {
const CFG = window.TIKTOK_INFORME || {};
const ORDER = ["Argentina", "Chile", "Perú"];
const $ = s => document.querySelector(s);
const esc = ttEsc, pct = ttPct;
const num = v => { const n = parseInt(String(v).replace(/[^\d-]/g, ""), 10); return isNaN(n) ? 0 : n; };
$("#bar-logo").innerHTML = TT_LOGO;
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function buildWeeks(rows){
  const [head, ...data] = rows;
  const k = Object.fromEntries(head.map((h, i) => [h.trim(), i]));
  const get = (r, name) => (r[k[name]] ?? "").trim();
  // por id (lunes|país) queda la aprobación más reciente
  const latest = new Map();
  data.filter(r => r.length > 4 && get(r, "lunes")).forEach(r => {
    const id = get(r, "id") || get(r, "lunes") + "|" + get(r, "pais");
    const prev = latest.get(id);
    if (!prev || get(r, "aprobado_en") >= get(prev, "aprobado_en")) latest.set(id, r);
  });
  const weeks = new Map();
  latest.forEach(r => {
    const lunes = get(r, "lunes");
    if (!weeks.has(lunes)) weeks.set(lunes, {lunes, domingo: get(r, "domingo"), rotulo: get(r, "semana"), paises: []});
    const pos = num(get(r, "positivas")), neu = num(get(r, "neutras")), neg = num(get(r, "negativas"));
    weeks.get(lunes).paises.push({
      pais: get(r, "pais"), pos, neu, neg, total: pos + neu + neg, proactivas: num(get(r, "proactivas")),
      texto_positivo: get(r, "texto_positivo"), texto_negativo: get(r, "texto_negativo"),
      destacadas: [1, 2].map(i => ({titulo: get(r, `destacada_${i}_titulo`), medio: get(r, `destacada_${i}_medio`), link: get(r, `destacada_${i}_link`)})).filter(d => d.titulo)
    });
  });
  return [...weeks.values()]
    .map(w => (w.paises.sort((a, b) => ORDER.indexOf(a.pais) - ORDER.indexOf(b.pais)), w))
    .sort((a, b) => b.lunes.localeCompare(a.lunes));
}



/* ---------- animaciones ---------- */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const ease = t => 1 - Math.pow(1 - t, 3);
function countUp(el, delay){
  const node = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.nodeValue));
  if (!node) return;
  const m = node.nodeValue.match(/^(\D*)(\d+)(.*)$/s);
  if (!m) return;
  const [, pre, digits, post] = m, end = parseInt(digits, 10);
  el.setAttribute("aria-label", node.nodeValue.trim());
  node.nodeValue = pre + "0" + post;
  el._run = () => {
    const dur = 1100 + Math.min(600, end * 2), t0 = performance.now() + (delay || 0);
    const step = now => {
      const t = Math.min(1, Math.max(0, (now - t0) / dur));
      node.nodeValue = pre + Math.round(ease(t) * end) + post;
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
}
let io = null;
function animateIn(root){
  if (REDUCED || !("IntersectionObserver" in window)) return;
  if (!io) io = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    e.target.querySelectorAll("[data-count]").forEach(el => el._run && el._run());
    e.target.querySelectorAll(".sweep").forEach((el, i) => setTimeout(() => el.classList.add("in"), i * 90));
    if (e.target.classList.contains("sweep")) e.target.classList.add("in");
  }), {threshold: 0, rootMargin: "0px 0px -12% 0px"});
  const groups = root.querySelectorAll(".tt-kpis, .tt-side, .wk");
  groups.forEach(g => {
    g.querySelectorAll(".tt-kpi b, .tt-bal b, .tt-bal em, .n").forEach((el, i) => { el.setAttribute("data-count", ""); countUp(el, i * 70); });
    g.querySelectorAll(".tt-bar, .stack").forEach(b => b.classList.add("sweep"));
    io.observe(g);
  });
}

let WEEKS = [];
function renderArchive(currentLunes){
  $("#semanas-anteriores").hidden = WEEKS.length < 1;
  $("#weeks").innerHTML = WEEKS.map(w => {
    const tot = w.paises.reduce((s, c) => s + c.total, 0);
    return `<a class="wk" href="#s-${esc(w.lunes)}" ${w.lunes === currentLunes ? 'aria-current="true"' : ""}>
      <span class="d">${esc(w.rotulo)}</span><div class="n">${tot}<small>notas</small></div>
      ${w.paises.map(c => `<div class="row"><span>${esc(c.pais)}</span><span class="stack" role="img" aria-label="${esc(c.pais)}: ${c.pos} positivas, ${c.neu} neutras, ${c.neg} negativas"><i style="width:${pct(c.pos,c.total)}%;background:#25F4EE"></i><i style="width:${pct(c.neu,c.total)}%;background:#5E5E5E"></i><i style="width:${pct(c.neg,c.total)}%;background:#FE2C55"></i></span></div>`).join("")}
    </a>`;
  }).join("");
}
function show(){
  if (!WEEKS.length) return;
  const m = location.hash.match(/^#s-(\d{4}-\d{2}-\d{2})$/);
  const w = (m && WEEKS.find(x => x.lunes === m[1])) || WEEKS[0];
  $("#report").innerHTML = ttReport(w, {latest: w === WEEKS[0]});
  renderArchive(w.lunes);
  animateIn(document);
  if (m) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { if (/^#s-/.test(location.hash) || location.hash === "") show(); });
async function load(){
  const override = new URLSearchParams(location.search).get("csv");
  const urls = [override, CFG.CSV_URL,
    CFG.SHEET_ID && `https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Informes`].filter(Boolean);
  for (const u of urls){
    try {
      const r = await fetch(u, {cache: "no-store"});
      if (!r.ok) continue;
      const t = await r.text();
      if (!/^\s*"?id"?,/.test(t)) continue;
      return buildWeeks(parseCSV(t));
    } catch {}
  }
  throw new Error("sin datos");
}

load().then(ws => {
  WEEKS = ws;
  if (!WEEKS.length) { $("#report").innerHTML = '<div class="status">Todavía no hay informes publicados. El primero aparece acá apenas se aprueba.</div>'; return; }
  show();
}).catch(() => {
  $("#report").innerHTML = '<div class="status">No se pudo leer el informe. Revisá que el Sheet de publicación esté publicado en la web y volvé a cargar la página.</div>';
});
})();
